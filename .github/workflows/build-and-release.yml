name: Build & Release Wattpad CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Automated Test Suite & Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install

      - name: Run Test Suite (100% Pass Required)
        run: bun test

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary: wattpad.exe
          - os: ubuntu-24.04
            target: linux-x64
            binary: wattpad-linux-x64
          - os: macos-latest
            target: darwin-arm64
            binary: wattpad-darwin-arm64
          - os: macos-13
            target: darwin-x64
            binary: wattpad-darwin-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install

      - name: Compile Native CLI Executable
        run: bun run scripts/build-cli.ts --target=${{ matrix.target }} --outfile=dist/${{ matrix.binary }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wattpad-cli-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets & Checksums
    needs: [build-binaries]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach Assets & Checksums to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
